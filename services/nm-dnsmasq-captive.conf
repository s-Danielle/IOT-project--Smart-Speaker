# Smart Speaker captive-portal DNS catch-all.
#
# Install to: /etc/NetworkManager/dnsmasq-shared.d/
#
# NetworkManager spawns a dedicated dnsmasq instance for connections with
# ipv4.method=shared (our SmartSpeaker-Setup AP) and passes it
# --conf-dir=/etc/NetworkManager/dnsmasq-shared.d, so this file only takes
# effect while the setup AP is active. In normal operation the Pi is a WiFi
# client, no shared connection exists, this dnsmasq isn't running, and this
# file has no effect - safe to leave installed permanently.
#
# Resolve EVERY DNS name to the AP address so OS captive-portal probes
# (connectivitycheck.gstatic.com, captive.apple.com, msftconnecttest.com, ...)
# reach the Pi's port-80 captive responder and trigger the
# "sign in to network" popup.
address=/#/192.168.4.1
