# Smart Speaker — reference Mopidy config
#
# This is NOT a drop-in replacement for the live /etc/mopidy/mopidy.conf.
# That file holds the Spotify settings and is not in the repo.
#
# Easiest: scripts/pi/pi_install_audio.sh --mopidy-conf copies the [audio],
# [mpd] and [file] settings below into the live file (it never touches
# [spotify]), after saving a copy that --rollback can restore.
#
# By hand: merge the [audio], [mpd] and [file] sections into the live file, then:
#   sudo systemctl restart mopidy
# Rollback: restore the copy you took before editing:
#   sudo cp /etc/mopidy/mopidy.conf.bak /etc/mopidy/mopidy.conf
#   sudo systemctl restart mopidy

[audio]
# Shared dmix via /etc/asound.conf (pcm.!default). mixer = none: volume
# is the card's PCM control, written only by the controller.
mixer = none
output = alsasink device=default

[mpd]
hostname = 127.0.0.1
port = 6600
# Schema is Integer(minimum=1); 0 is rejected. 86400 keeps an idle
# command connection from being reaped after the 60s default.
connection_timeout = 86400

[file]
enabled = true
# Recordings and uploads play today via the stream backend's file:// links.
# Listing the folders here is what Mopidy-File needs, and it only works if the
# mopidy user can read them. pi_install_audio.sh makes the folders belong to
# iot-proj and lets mopidy in through group permissions (not world access).
# By hand: add mopidy to the iot-proj group, let that group enter
# /home/iot-proj (chmod g+x) and let it read the folders.
media_dirs =
    /home/iot-proj/music
    /home/iot-proj/IOT-project--Smart-Speaker/Main/local_files/recordings
    /home/iot-proj/IOT-project--Smart-Speaker/Main/local_files/uploads

# --- Spotify: placeholders only. The real values stay in the live file; never commit them. ---
# The old username/password fields are gone: they stopped working in Mopidy-Spotify 5.
# Web API login (browsing, search, links; redo about every 6 months):
#   open https://auth.mopidy.com/spotify/, log in with the Premium account and
#   paste the two values it shows.
# Streaming has its own login, and that is what broke in Aug 2026: see docs/SPOTIFY.md.
[spotify]
enabled = true
client_id = YOUR_CLIENT_ID
client_secret = YOUR_CLIENT_SECRET
