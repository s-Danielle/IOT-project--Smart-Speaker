# Smart Speaker — reference Mopidy config
#
# This is NOT a drop-in replacement for the live /etc/mopidy/mopidy.conf.
# That file holds Spotify credentials and is not in the repo. Merge the
# sections below into the live file, then:
#   sudo systemctl restart mopidy
#
# Rollback: restore the copy you took before editing:
#   sudo cp /etc/mopidy/mopidy.conf.bak /etc/mopidy/mopidy.conf
#   sudo systemctl restart mopidy

[audio]
# Shared dmix via /etc/asound.conf (pcm.!default). mixer = none: volume
# is the card's PCM control, written only by the controller.
mixer = none
output = alsasink device=default

[mpd]
hostname = 127.0.0.1
port = 6600
# Schema is Integer(minimum=1); 0 is rejected. 86400 keeps an idle
# command connection from being reaped after the 60s default.
connection_timeout = 86400

[file]
enabled = true
# Recordings play today via the stream backend's file:// URIs. Listing
# the directory here is what Mopidy-File needs, and it only works if the
# mopidy user can read the path. Bookworm home directories are 0750, so
# either:
#   sudo chmod o+x /home/iot-proj
#   sudo chmod -R o+rX /home/iot-proj/IOT-project--Smart-Speaker/Main/local_files/recordings
# or add mopidy to the iot-proj group and make the tree group-readable.
media_dirs =
    /home/iot-proj/music
    /home/iot-proj/IOT-project--Smart-Speaker/Main/local_files/recordings

# --- placeholders only; copy values from the live file, do not commit secrets ---
[spotify]
username = YOUR_SPOTIFY_USERNAME
password = YOUR_SPOTIFY_PASSWORD
client_id = YOUR_SPOTIFY_CLIENT_ID
client_secret = YOUR_SPOTIFY_CLIENT_SECRET
