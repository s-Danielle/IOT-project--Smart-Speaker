# Smart Speaker ALSA config
#
# Install:
#   sudo cp /etc/asound.conf /etc/asound.conf.bak   # keep the seeed-voicecard copy
#   sudo cp services/audio/asound.conf /etc/asound.conf
# Rollback:
#   sudo mv /etc/asound.conf.bak /etc/asound.conf
#
# Confirm the card with `aplay -l`. This file assumes card 0 is
# seeed2micvoicec (TLV320AIC3x). If the index differs, change every
# `hw:0,0` and `card 0` below.
#
# Both mopidy and iot-proj must be in the audio group, otherwise the
# second user cannot attach to the dmix instance:
#   sudo usermod -aG audio iot-proj
#   sudo usermod -aG audio mopidy
#
# dmix/dsnoop ipc_perm 0666 is required for the same reason: the first
# opener creates the IPC segment 0600 unless told otherwise.
#
# Pin the dmix slave rate to the hardware rate so Mopidy and aplay
# cannot disagree. Confirm with:
#   aplay -D hw:0,0 --dump-hw-params /dev/zero
# If the card is not 48000 Hz, change `rate` in both slaves.

pcm.speaker_mix {
    type dmix
    ipc_key 1029
    ipc_key_add_uid false
    ipc_perm 0666
    slave {
        pcm "hw:0,0"
        period_time 0
        period_size 1024
        buffer_size 8192
        rate 48000
        format S16_LE
        channels 2
    }
}

pcm.speaker_capture {
    type dsnoop
    ipc_key 1030
    ipc_key_add_uid false
    ipc_perm 0666
    slave {
        pcm "hw:0,0"
        period_time 0
        period_size 1024
        buffer_size 8192
        rate 48000
        format S16_LE
        channels 2
    }
}

# RECORDING_DEVICE is empty, so arecord uses `default`. dmix is
# playback-only; capture has to go through dsnoop or recording and PTT
# break.
pcm.!default {
    type asym
    playback.pcm {
        type plug
        slave.pcm "speaker_mix"
    }
    capture.pcm {
        type plug
        slave.pcm "speaker_capture"
    }
}

# Second playback path into the same dmix. Feedback WAVs play here via
# `aplay -D feedback` so they layer over music instead of replacing it.
# Volume is the card's PCM control (downstream of dmix), not a softvol.
pcm.feedback {
    type plug
    slave.pcm "speaker_mix"
}

ctl.!default {
    type hw
    card 0
}
